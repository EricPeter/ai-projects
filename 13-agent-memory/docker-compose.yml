version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_memory:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8013:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      QDRANT_HOST: qdrant
    depends_on: [redis, qdrant]
    restart: unless-stopped

volumes:
  qdrant_memory:
