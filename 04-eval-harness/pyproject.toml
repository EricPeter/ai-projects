[project]
name = "eval-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "deepeval>=1.0.0",
    "ragas>=0.1.0",
    "anthropic>=0.28.0",
    "openai>=1.0.0",
    "pytest>=8.0.0",
    "langsmith>=0.1.0",
    "pydantic>=2.0.0",
    "sentence-transformers>=3.0.0",
    "datasets>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
