version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8012:8000"
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      REDIS_URL: redis://redis:6379
    depends_on: [qdrant, redis]
    restart: unless-stopped

volumes:
  qdrant_storage:
