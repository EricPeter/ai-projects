services:
  api:
    build: .
    ports:
      - "8024:8024"
    env_file: .env
    volumes:
      # Mount artefacts so they survive container restarts
      - ./outputs:/app/outputs
      - ./data/spell:/app/data/spell
      - ./data/ngram:/app/data/ngram
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8024/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
