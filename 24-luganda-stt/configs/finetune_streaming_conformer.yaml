# Fine-tune a CACHE-AWARE STREAMING FastConformer-Transducer (Parakeet-style)
# on Luganda for low-latency live ASR.
#
# Run:
#   python scripts/build_tokenizer.py                       # -> data/tokenizers/luganda_spe
#   python scripts/train_streaming_asr.py \
#       model.tokenizer.dir=data/tokenizers/luganda_spe
#
# Notes
# -----
# * att_context_style: chunked_limited + causal convs = true cache-aware streaming.
#   Look-ahead(secs) = att_context_size[1] * subsampling_factor * window_stride
#                    = 13 * 8 * 0.01 = 1.04 s. Lower the right context for lower latency.
# * We initialise the ENCODER from a pretrained cache-aware streaming model and
#   train a fresh Luganda decoder/joint (new tokenizer) -> exclude decoder+joint.
# * fastemit_lambda reduces transducer emission latency (good for streaming).
# * No feature normalization ("NA") -> stable streaming.

name: "Luganda-Streaming-FastConformer-Transducer"

# Encoder init from a cache-aware streaming English model; decoder/joint are
# retrained for the Luganda tokenizer, so they are excluded from the transfer.
init_from_pretrained_model:
  encoder_init:
    name: stt_en_fastconformer_hybrid_large_streaming_multi
    include: ["encoder"]
    exclude: ["decoder", "joint", "ctc_decoder"]

model:
  sample_rate: 16000
  compute_eval_loss: false
  log_prediction: true
  skip_nan_grad: false

  model_defaults:
    enc_hidden: ${model.encoder.d_model}
    pred_hidden: 640
    joint_hidden: 640

  train_ds:
    manifest_filepath: data/manifests/train.json
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: true
    num_workers: 8
    pin_memory: true
    max_duration: 20
    min_duration: 0.1
    is_tarred: false
    shuffle_n: 2048
    bucketing_strategy: "synced_randomized"

  validation_ds:
    manifest_filepath: data/manifests/dev.json
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 8
    pin_memory: true

  test_ds:
    manifest_filepath: data/manifests/test.json
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: false
    use_start_end_token: false
    num_workers: 8
    pin_memory: true

  tokenizer:
    dir: ???            # set to the dir printed by build_tokenizer.py
    type: bpe

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: ${model.sample_rate}
    normalize: "NA"     # no normalization -> streaming friendly
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 80
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 0

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: ${model.preprocessor.features}
    feat_out: -1
    n_layers: 17
    d_model: 512
    use_bias: true

    subsampling: dw_striding
    subsampling_factor: 8
    subsampling_conv_channels: 256
    causal_downsampling: true

    ff_expansion_factor: 4
    self_attention_model: rel_pos
    n_heads: 8

    # Cache-aware streaming: [left, right]. Multi-lookahead list also supported.
    att_context_size: [70, 13]
    att_context_style: chunked_limited
    att_context_probs: null

    xscaling: true
    pos_emb_max_len: 5000

    conv_kernel_size: 9
    conv_norm_type: 'layer_norm'
    conv_context_size: causal

    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1

  decoder:
    _target_: nemo.collections.asr.modules.RNNTDecoder
    normalization_mode: null
    random_state_sampling: false
    blank_as_pad: true
    prednet:
      pred_hidden: ${model.model_defaults.pred_hidden}
      pred_rnn_layers: 1
      t_max: null
      dropout: 0.2

  joint:
    _target_: nemo.collections.asr.modules.RNNTJoint
    log_softmax: null
    preserve_memory: false
    fuse_loss_wer: true
    fused_batch_size: 4
    jointnet:
      joint_hidden: ${model.model_defaults.joint_hidden}
      activation: "relu"
      dropout: 0.2

  decoding:
    strategy: "greedy_batch"
    greedy:
      max_symbols: 10
    beam:
      beam_size: 2
      return_best_hypothesis: false

  loss:
    loss_name: "default"
    warprnnt_numba_kwargs:
      fastemit_lambda: 5e-3     # lowers streaming emission latency
      clamp: -1.0

  optim:
    name: adamw
    # Fine-tuning LR: much lower than the from-scratch Noam (lr=5.0) recipe.
    lr: 1e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    sched:
      name: CosineAnnealing
      warmup_steps: 2000
      min_lr: 1e-6

trainer:
  devices: -1
  num_nodes: 1
  max_epochs: 100
  max_steps: -1
  val_check_interval: 1.0
  accelerator: auto
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: bf16-mixed
  log_every_n_steps: 50
  enable_progress_bar: true
  num_sanity_val_steps: 0
  sync_batchnorm: true
  enable_checkpointing: false
  logger: false
  benchmark: false

exp_manager:
  exp_dir: outputs/streaming_luganda
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 5
    always_save_nemo: true
  resume_if_exists: true
  resume_ignore_no_checkpoint: true
