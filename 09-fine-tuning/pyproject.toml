[project]
name = "fine-tuning-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.41.0",
    "peft>=0.11.0",
    "trl>=0.9.0",
    "datasets>=2.19.0",
    "torch>=2.3.0",
    "accelerate>=0.30.0",
    "evaluate>=0.4.0",
    "rouge-score>=0.1.2",
    "wandb>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
