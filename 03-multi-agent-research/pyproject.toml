[project]
name = "multi-agent-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.55.0",
    "crewai-tools>=0.8.0",
    "anthropic>=0.28.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
