[project]
name = "production-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "anthropic>=0.28.0",
    "langgraph>=0.1.0",
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.1",
    "rank-bm25>=0.2.2",
    "pypdf>=4.2.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
