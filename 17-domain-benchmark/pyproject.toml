[project]
name = "legal-ai-benchmark"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "rich>=13.0.0",
    "sentence-transformers>=3.0.0",
    "rouge-score>=0.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
