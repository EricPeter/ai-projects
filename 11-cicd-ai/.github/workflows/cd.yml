name: CD

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}/ai-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest

  deploy-canary:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - name: Update image tag in ArgoCD manifest
        run: |
          sed -i "s|image: .*|image: ${{ env.IMAGE }}:${{ github.sha }}|" argocd/application.yml
          git config user.email "ci@github.com"
          git config user.name "CI"
          git commit -am "ci: deploy ${{ github.sha }}"
          git push
      - name: Wait for ArgoCD sync
        run: sleep 60  # ArgoCD auto-syncs; in production, poll argocd app wait
      - name: Run smoke tests against canary
        run: bash scripts/smoke_test.sh
        env:
          TARGET_URL: ${{ secrets.CANARY_URL }}

  promote-or-rollback:
    runs-on: ubuntu-latest
    needs: deploy-canary
    if: always()
    steps:
      - name: Promote if smoke tests passed
        if: needs.deploy-canary.result == 'success'
        run: echo "Canary promoted — ArgoCD Rollout handles traffic shift to 100%"
      - name: Rollback if smoke tests failed
        if: needs.deploy-canary.result == 'failure'
        run: |
          echo "Smoke tests failed — triggering rollback"
          # argocd app rollback ai-service
          echo "Rollback triggered"
