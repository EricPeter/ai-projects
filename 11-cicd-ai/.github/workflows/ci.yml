name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check src/
      - run: uv run mypy src/ --ignore-missing-imports

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest tests/ -v

  eval-harness:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Run golden eval suite
        id: eval
        run: |
          uv run pytest tests/test_eval.py -v --json-report --json-report-file=eval_results.json
          SCORE=$(python -c "import json; d=json.load(open('eval_results.json')); print(d['summary']['passed']/d['summary']['total'])")
          echo "score=$SCORE" >> $GITHUB_OUTPUT
      - name: Post eval summary to PR
        uses: actions/github-script@v7
        with:
          script: |
            const score = '${{ steps.eval.outputs.score }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Eval Harness Results\n\n**Score:** ${(parseFloat(score)*100).toFixed(1)}%\n\n${parseFloat(score) >= 0.9 ? '✅ Quality gate passed' : '❌ Quality gate failed — merge blocked'}`
            });
      - name: Fail if score below threshold
        run: |
          python -c "
          import json, sys
          d = json.load(open('eval_results.json'))
          score = d['summary']['passed'] / d['summary']['total']
          if score < 0.9:
              print(f'FAIL: eval score {score:.2%} < 90% threshold')
              sys.exit(1)
          print(f'PASS: eval score {score:.2%}')
          "

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run bandit -r src/ -ll
