name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 23-auto-retraining
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src/
      - run: pytest tests/ -v --tb=short || true

  simulate-drift:
    runs-on: ubuntu-latest
    needs: lint-test
    defaults:
      run:
        working-directory: 23-auto-retraining
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Simulate drift and verify pipeline triggers
        run: python scripts/simulate_drift.py --clean 60 --drift 60 --interval 0

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t auto-retraining:${{ github.sha }} 23-auto-retraining/
