<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HITL Approval UI</title>
  <style>
    body { font-family: system-ui; background: #0f172a; color: #e2e8f0; padding: 2rem; }
    h1 { color: #60a5fa; }
    .card { background: #1e293b; border-radius: 8px; padding: 1.5rem; margin: 1rem 0; border: 1px solid #334155; }
    button { padding: 0.5rem 1.25rem; border-radius: 6px; border: none; cursor: pointer; font-size: 0.9rem; margin: 0.25rem; }
    .approve { background: #16a34a; color: white; }
    .reject { background: #dc2626; color: white; }
    textarea { width: 100%; background: #0f172a; color: #e2e8f0; border: 1px solid #475569; border-radius: 4px; padding: 0.5rem; }
    .empty { color: #64748b; text-align: center; padding: 2rem; }
  </style>
</head>
<body>
  <h1>Human Approval Queue</h1>
  <div id="queue"></div>

  <script>
    const API = 'http://localhost:8000';

    async function loadQueue() {
      const r = await fetch(`${API}/workflows/pending`);
      const data = await r.json();
      const el = document.getElementById('queue');
      if (!data.pending?.length) {
        el.innerHTML = '<div class="empty">No pending approvals</div>';
        return;
      }
      el.innerHTML = data.pending.map(p => `
        <div class="card">
          <strong>Workflow:</strong> ${p.workflow_id}<br>
          <strong>Requested:</strong> ${p.requested_at}<br>
          <strong>Pending Action:</strong>
          <pre style="white-space:pre-wrap;font-size:0.85rem;margin:0.5rem 0">${p.pending_action}</pre>
          <textarea id="fb-${p.workflow_id}" placeholder="Optional feedback..." rows="2"></textarea>
          <br>
          <button class="approve" onclick="decide('${p.workflow_id}','approve')">Approve</button>
          <button class="reject" onclick="decide('${p.workflow_id}','reject')">Reject</button>
        </div>
      `).join('');
    }

    async function decide(id, action) {
      const feedback = document.getElementById(`fb-${id}`)?.value || '';
      await fetch(`${API}/workflows/${id}/${action}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ decided_by: 'human-ui', feedback })
      });
      loadQueue();
    }

    loadQueue();
    setInterval(loadQueue, 5000);
  </script>
</body>
</html>
