version: "3.8"

services:
  vllm:
    image: vllm/vllm-openai:latest
    command:
      - "--model"
      - "Sunbird/Sunflower-14B-W8A8"
      - "--quantization"
      - "fp8"
      - "--port"
      - "8080"
      - "--max-model-len"
      - "4096"
      - "--dtype"
      - "auto"
    ports:
      - "8080:8080"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8018:8000"
    env_file: .env
    environment:
      VLLM_URL: http://vllm:8080
    depends_on: [vllm]
    restart: unless-stopped

volumes:
  hf_cache:
