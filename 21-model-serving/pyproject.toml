[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-serving"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "onnxruntime>=1.17",
    "numpy>=1.24",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
export = ["torch>=2.1", "transformers>=4.38", "optimum[onnxruntime]>=1.17"]
eval   = ["datasets>=2.18", "transformers>=4.38"]
gpu    = ["onnxruntime-gpu>=1.17"]
dev    = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
