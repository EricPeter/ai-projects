name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 21-model-serving
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src/
      - run: pytest tests/ -v --tb=short || true

  eval-gate:
    runs-on: ubuntu-latest
    needs: lint-test
    defaults:
      run:
        working-directory: 21-model-serving
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[export,eval]"
      - name: Export model
        run: python scripts/export_onnx.py --output models/distilbert.onnx
      - name: Eval on SST-2 validation set
        run: |
          python scripts/eval.py --model models/distilbert.onnx --split validation
      - name: Check accuracy gate (must be > 90%)
        run: |
          python - <<'EOF'
          import subprocess, sys, re
          out = subprocess.check_output([
              "python", "scripts/eval.py", "--model", "models/distilbert.onnx",
              "--split", "validation", "--max-samples", "200"
          ]).decode()
          m = re.search(r"Accuracy: ([0-9.]+)", out)
          acc = float(m.group(1)) if m else 0
          print(f"Accuracy: {acc:.4f}")
          if acc < 0.90:
              print(f"FAILED: accuracy {acc:.4f} < 0.90 threshold")
              sys.exit(1)
          print("PASSED: accuracy gate")
          EOF

  docker:
    runs-on: ubuntu-latest
    needs: eval-gate
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t model-serving:${{ github.sha }} 21-model-serving/
